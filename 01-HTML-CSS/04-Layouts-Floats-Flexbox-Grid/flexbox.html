<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .el--1 {
        background-color: blueviolet;
      }
      .el--2 {
        background-color: orangered;
      }
      .el--3 {
        background-color: green;
        height: 150px;
      }
      .el--4 {
        background-color: goldenrod;
      }
      .el--5 {
        background-color: palevioletred;
      }
      .el--6 {
        background-color: steelblue;
      }
      .el--7 {
        background-color: yellow;
      }
      .el--8 {
        background-color: crimson;
      }

      /*====FLEXBOX CONTAINER====*/
      .container {
        /* STARTER */
        font-family: sans-serif;
        background-color: #ddd;
        font-size: 32px;
        margin: 40px;

        /* FLEXBOX */
        display: flex;
        align-items: center; /* ALIGN ALONG THE CROSS AXIS (Vertical) */
        justify-content: flex-start; /* DISTRIBUTE ALONG THE MAIN AXIS (Horizontal) */
        gap: 10px; /* Space between items (replaces margin) */
      }

      .el {
        /*
        DEFAULTS:
        flex-grow: 0;
        flex-shrink: 1;
        flex-basis: auto;
        */

        /*flex-basis: 200px;*/
        /*flex-shrink: 0;*/
        flex: 0 0 200px;

        /*flex-grow: 1;*/
        /*flex: 1;*/
      }

      .el--1 {
        align-self: flex-start; /* Overrides align-items */
        /*order: 2;*/
      }

      .el--5 {
        align-self: stretch; /* This item takes full height */
        order: 1; /* 1 → moves to the end */
      }

      .el--6 {
        order: -1; /* Negative → moves to the beginning */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="el el--1">HTML</div>
      <div class="el el--2">and</div>
      <div class="el el--3">CSS</div>
      <div class="el el--4">are</div>
      <div class="el el--5">amazing</div>
      <div class="el el--6">languages</div>
      <div class="el el--7">to</div>
      <div class="el el--8">learn</div>
    </div>
  </body>
</html>
